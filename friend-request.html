<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Friend? 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root { --dark: #2d1b4e; }

  html, body { width:100%; height:100%; overflow:hidden; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 30%, #ffd6e7 60%, #c9b1ff 100%);
    font-family: 'Nunito', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .bg-hearts { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .heart-float {
    position: absolute;
    opacity: 0.18;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { transform:translateY(110vh) rotate(0deg);   opacity:.18; }
    100% { transform:translateY(-10vh) rotate(360deg); opacity:0; }
  }

  .card {
    position: relative; z-index:10;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(16px);
    border-radius: 32px;
    padding: 52px 60px 48px;
    box-shadow: 0 20px 80px rgba(200,80,120,0.2), 0 4px 20px rgba(0,0,0,0.08);
    text-align: center;
    max-width: 440px;
    width: 90vw;
    border: 2px solid rgba(255,255,255,0.8);
    animation: cardIn 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes cardIn {
    from { opacity:0; transform:scale(0.6) translateY(40px); }
    to   { opacity:1; transform:scale(1) translateY(0); }
  }

  .buddy {
    font-size: 5rem;
    display: block;
    margin-bottom: 12px;
    animation: bounce 1.8s ease-in-out infinite;
  }
  @keyframes bounce {
    0%,100% { transform:translateY(0); }
    50%      { transform:translateY(-14px); }
  }

  h1 {
    font-family: 'Pacifico', cursive;
    color: var(--dark);
    font-size: 1.65rem;
    margin-bottom: 8px;
    line-height: 1.35;
  }
  .sub {
    color: #a07090;
    font-size: 0.95rem;
    margin-bottom: 38px;
    font-weight: 700;
  }

  .btn-yes {
    font-family: 'Nunito', sans-serif;
    font-size: 1.15rem;
    font-weight: 800;
    border: none;
    border-radius: 50px;
    padding: 14px 52px;
    cursor: pointer;
    background: linear-gradient(135deg, #ff6b9d, #ff3d88);
    color: #fff;
    box-shadow: 0 6px 24px rgba(255,60,136,0.38);
    transition: transform .15s, box-shadow .15s;
    display: block;
    margin: 0 auto;
  }
  .btn-yes:hover {
    transform: scale(1.08);
    box-shadow: 0 10px 32px rgba(255,60,136,0.5);
  }

  /* ── NO BUTTON: fixed, roams entire viewport ── */
  #noBtn {
    position: fixed;
    left: 65%;
    top: 62%;
    z-index: 9999;
    font-family: 'Nunito', sans-serif;
    font-size: 1.05rem;
    font-weight: 800;
    border: none;
    border-radius: 50px;
    padding: 13px 38px;
    cursor: pointer;
    background: linear-gradient(135deg, #e8e8e8, #d0d0d0);
    color: #888;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    transition: left 0.22s cubic-bezier(0.34,1.56,0.64,1),
                top  0.22s cubic-bezier(0.34,1.56,0.64,1);
    white-space: nowrap;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ── YES SCREEN ── */
  #yes-screen {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 500;
    background: linear-gradient(160deg, #fff0f8 0%, #ffe4f4 50%, #f0e8ff 100%);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  #yes-screen.show { display:flex; animation: fadeInBig .6s ease both; }
  @keyframes fadeInBig {
    from { opacity:0; transform:scale(0.85); }
    to   { opacity:1; transform:scale(1); }
  }

  .scene {
    position: relative;
    width: 240px; height: 280px;
    margin: 0 auto 20px;
  }

  .boy-wrap {
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    animation: boyIn .8s cubic-bezier(0.34,1.56,0.64,1) both .2s;
  }
  @keyframes boyIn {
    from { transform:translateX(-50%) translateY(80px) scale(.7); opacity:0; }
    to   { transform:translateX(-50%) translateY(0)   scale(1);   opacity:1; }
  }

  .rose-wrap {
    position: absolute;
    bottom: 106px;
    left: 53%;
    transform-origin: bottom left;
    animation: offerRose 1s cubic-bezier(0.34,1.56,0.64,1) both 1s;
  }
  @keyframes offerRose {
    from { transform:rotate(-85deg) scale(.3); opacity:0; }
    to   { transform:rotate(-18deg) scale(1);  opacity:1; }
  }

  .sparkle {
    position: absolute;
    font-size: 1.5rem;
    animation: twinkle 1.6s ease-in-out infinite;
  }
  .sparkle:nth-child(1){top:5px; left:18px;  animation-delay:0s;}
  .sparkle:nth-child(2){top:28px;right:12px; animation-delay:.4s;}
  .sparkle:nth-child(3){top:72px;left:4px;   animation-delay:.8s;}
  .sparkle:nth-child(4){top:0;   right:32px; animation-delay:1.2s;}
  @keyframes twinkle {
    0%,100%{transform:scale(1)   rotate(0deg);  opacity:1;}
    50%    {transform:scale(1.7) rotate(20deg); opacity:.5;}
  }

  .hburst {
    position: absolute;
    font-size: 1.3rem;
    animation: burstH 2.2s ease-out infinite;
  }
  @keyframes burstH {
    0%  {transform:translate(0,0) scale(.5); opacity:1;}
    100%{transform:translate(var(--dx),var(--dy)) scale(1.3); opacity:0;}
  }

  .yes-title {
    font-family: 'Pacifico', cursive;
    font-size: 2.2rem;
    color: var(--dark);
    margin-bottom: 12px;
    animation: titlePop .6s cubic-bezier(0.34,1.56,0.64,1) both 1.3s;
  }
  @keyframes titlePop {
    from{transform:scale(.4);opacity:0;}
    to  {transform:scale(1); opacity:1;}
  }
  .yes-msg {
    font-size: 1.1rem;
    color: #a07090;
    font-weight: 700;
    max-width: 300px;
    line-height: 1.7;
    animation: fadeUp .6s ease both 1.8s;
  }
  @keyframes fadeUp {
    from{transform:translateY(20px);opacity:0;}
    to  {transform:translateY(0);   opacity:1;}
  }

  .confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:600;}
  .cp{
    position:absolute; top:-20px; border-radius:2px;
    animation:cfFall linear forwards;
  }
  @keyframes cfFall{
    0%  {transform:translateY(0) rotate(0deg);   opacity:1;}
    100%{transform:translateY(110vh) rotate(720deg); opacity:0;}
  }
</style>
</head>
<body>

<div class="bg-hearts" id="bgHearts"></div>

<div class="card">
  <span class="buddy">🧑‍💻</span>
  <h1>Will you be my<br>good friend? 🤝</h1>
  <p class="sub">This is very very important to me... 👉👈</p>
  <button class="btn-yes" onclick="sayYes()">😊 Yes, of course!</button>
</div>

<!-- No button lives OUTSIDE card, position:fixed -->
<button id="noBtn">😅 No</button>

<!-- YES screen -->
<div id="yes-screen">
  <div class="confetti-wrap" id="confettiWrap"></div>

  <div class="scene">
    <span class="sparkle">✨</span>
    <span class="sparkle">⭐</span>
    <span class="sparkle">💫</span>
    <span class="sparkle">🌟</span>
    <span class="hburst" style="left:50%;top:35%;--dx:-70px;--dy:-90px;">💗</span>
    <span class="hburst" style="left:50%;top:35%;--dx:65px;--dy:-80px;animation-delay:.35s">💕</span>
    <span class="hburst" style="left:50%;top:35%;--dx:-10px;--dy:-110px;animation-delay:.7s">❤️</span>

    <div class="boy-wrap">
      <svg width="155" height="215" viewBox="0 0 155 215" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="77" cy="210" rx="48" ry="7" fill="rgba(0,0,0,0.08)"/>
        <ellipse cx="55" cy="203" rx="21" ry="8" fill="#2d1b4e"/>
        <ellipse cx="99" cy="203" rx="21" ry="8" fill="#2d1b4e"/>
        <rect x="43" y="146" width="28" height="60" rx="13" fill="#3a2d6e"/>
        <rect x="83" y="146" width="28" height="60" rx="13" fill="#3a2d6e"/>
        <rect x="40" y="144" width="74" height="10" rx="5" fill="#2d1b4e"/>
        <rect x="71" y="145" width="12" height="8" rx="2" fill="#ffe066"/>
        <rect x="38" y="93" width="78" height="62" rx="20" fill="#ff6b9d"/>
        <polygon points="66,93 77,108 89,93" fill="#fff"/>
        <rect x="14" y="96" width="25" height="56" rx="12" fill="#ffcba4" transform="rotate(10,26,124)"/>
        <rect x="116" y="96" width="25" height="56" rx="12" fill="#ffcba4" transform="rotate(-22,128,124)"/>
        <rect x="66" y="76" width="22" height="22" rx="10" fill="#ffcba4"/>
        <ellipse cx="77" cy="58" rx="40" ry="42" fill="#ffcba4"/>
        <ellipse cx="77" cy="22" rx="40" ry="17" fill="#2d1b4e"/>
        <ellipse cx="40" cy="42" rx="11" ry="19" fill="#2d1b4e"/>
        <ellipse cx="114" cy="42" rx="11" ry="19" fill="#2d1b4e"/>
        <rect x="50" y="53" width="21" height="15" rx="7" fill="none" stroke="#2d1b4e" stroke-width="2.8"/>
        <rect x="83" y="53" width="21" height="15" rx="7" fill="none" stroke="#2d1b4e" stroke-width="2.8"/>
        <line x1="71" y1="60" x2="83" y2="60" stroke="#2d1b4e" stroke-width="2.3"/>
        <line x1="29" y1="60" x2="50" y2="60" stroke="#2d1b4e" stroke-width="1.8"/>
        <line x1="104" y1="60" x2="125" y2="60" stroke="#2d1b4e" stroke-width="1.8"/>
        <path d="M56 63 Q61 69 66 63" stroke="#2d1b4e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <path d="M89 63 Q94 69 99 63" stroke="#2d1b4e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <path d="M58 77 Q77 93 97 77" stroke="#e8735a" stroke-width="2.8" stroke-linecap="round" fill="none"/>
        <ellipse cx="51" cy="75" rx="9" ry="6" fill="#ffb3c6" opacity="0.6"/>
        <ellipse cx="103" cy="75" rx="9" ry="6" fill="#ffb3c6" opacity="0.6"/>
        <polygon points="66,97 77,106 89,97 77,88" fill="#ffe066"/>
      </svg>
    </div>

    <div class="rose-wrap">
      <svg width="68" height="82" viewBox="0 0 68 82" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="34" y1="82" x2="34" y2="26" stroke="#4CAF50" stroke-width="4" stroke-linecap="round"/>
        <ellipse cx="23" cy="56" rx="13" ry="6" fill="#66BB6A" transform="rotate(-30,23,56)"/>
        <circle cx="34" cy="22" r="13" fill="#ff4d8d"/>
        <circle cx="25" cy="16" r="9"  fill="#ff6b9d"/>
        <circle cx="43" cy="16" r="9"  fill="#ff6b9d"/>
        <circle cx="34" cy="10" r="9"  fill="#ff88b3"/>
        <circle cx="34" cy="20" r="7"  fill="#ff4d8d"/>
        <circle cx="34" cy="18" r="4"  fill="#e0003c"/>
      </svg>
    </div>
  </div>

  <div class="yes-title">You're the Best! 🎉</div>
  <p class="yes-msg">
    You will always be my best friend<br>
    forever and ever! 💖<br>
    <span style="font-size:1.5rem;">🌹 ✨ 🎊</span>
  </p>
</div>

<script>
// ── BG floating hearts ──
(function(){
  const bg = document.getElementById('bgHearts');
  const emojis = ['💕','💗','💓','💞','🩷','❤️','🌸','💖'];
  for (let i = 0; i < 22; i++) {
    const h = document.createElement('span');
    h.className = 'heart-float';
    h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (1 + Math.random() * 1.2) + 'rem';
    h.style.animationDuration = (8 + Math.random() * 10) + 's';
    h.style.animationDelay = (-Math.random() * 15) + 's';
    bg.appendChild(h);
  }
})();

// ── No button runaway ──
const noBtn = document.getElementById('noBtn');
let busy = false;

function flee() {
  if (busy) return;
  busy = true;

  const pad = 20;
  const bw  = noBtn.offsetWidth  || 120;
  const bh  = noBtn.offsetHeight || 48;
  const vw  = window.innerWidth;
  const vh  = window.innerHeight;

  // current center
  const r  = noBtn.getBoundingClientRect();
  const cx = r.left + bw / 2;
  const cy = r.top  + bh / 2;

  // pick random spot far away
  let nx, ny, tries = 0;
  do {
    nx = pad + Math.random() * (vw - bw - pad * 2);
    ny = pad + Math.random() * (vh - bh - pad * 2);
    tries++;
  } while (Math.hypot(nx - cx, ny - cy) < 150 && tries < 30);

  noBtn.style.left = nx + 'px';
  noBtn.style.top  = ny + 'px';

  setTimeout(() => { busy = false; }, 280);
}

// Desktop — flee when mouse is within 90px
document.addEventListener('mousemove', function(e) {
  const r  = noBtn.getBoundingClientRect();
  const cx = r.left + r.width  / 2;
  const cy = r.top  + r.height / 2;
  if (Math.hypot(e.clientX - cx, e.clientY - cy) < 90) flee();
});

// Mobile — flee on tap
noBtn.addEventListener('touchstart', function(e) {
  e.preventDefault();
  flee();
}, { passive: false });

// Click (just in case they somehow catch it)
noBtn.addEventListener('click', function(e) {
  e.preventDefault();
  flee();
});

// ── Yes ──
function sayYes() {
  document.getElementById('noBtn').style.display = 'none';
  document.getElementById('yes-screen').classList.add('show');
  spawnConfetti();
}

function spawnConfetti() {
  const wrap   = document.getElementById('confettiWrap');
  const colors = ['#ff6b9d','#ffe066','#a0f0c8','#c9b1ff','#ff4d8d','#66BB6A','#fcb69f','#87ceeb'];
  for (let i = 0; i < 110; i++) {
    const p  = document.createElement('div');
    p.className = 'cp';
    const sz = 6 + Math.random() * 9;
    p.style.left             = Math.random() * 100 + 'vw';
    p.style.width            = sz + 'px';
    p.style.height           = sz + 'px';
    p.style.background       = colors[Math.floor(Math.random() * colors.length)];
    p.style.borderRadius     = Math.random() > .5 ? '50%' : '3px';
    p.style.animationDuration = (2 + Math.random() * 2.5) + 's';
    p.style.animationDelay   = (Math.random() * 1.4) + 's';
    wrap.appendChild(p);
  }
}
</script>
</body>
</html>
